        color-scheme: light dark;

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: max(20px, env(safe-area-inset-top)) 18px max(18px, env(safe-area-inset-bottom));
      }
      .intro {
        text-align: center;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.5;
        margin: 6px 8px 18px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
        padding: 30px 24px 26px;
        min-height: 264px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .ornament { margin-bottom: 18px; opacity: 0.85; }
      .verse-text {
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
        font-size: clamp(1.38rem, 5.4vw, 1.72rem);
        line-height: 1.55;
        margin: 0;
        overflow-wrap: break-word;
      }
      .verse-ref {
        margin: 20px 0 0;
        font-size: 0.92rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      .card.swap .verse-text, .card.swap .verse-ref { animation: fadein 0.45s ease both; }
      @keyframes fadein {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .card.swap .verse-text, .card.swap .verse-ref { animation: none; }
      }
      .primary {
        margin-top: 20px;
        width: 100%;
        border: none;
        border-radius: 14px;
        background: var(--btn);
        color: var(--btn-ink);
        font-size: 1.16rem;
        font-weight: 700;
        padding: 17px 16px;
        cursor: pointer;
        touch-action: manipulation;
      }
      .primary:hover { background: var(--btn-hover); }
      .primary:active { transform: scale(0.99); }
      .row {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }
      .row button {
        flex: 1;
        border-radius: 14px;
        border: 1.5px solid var(--btn2-border);
        background: transparent;
        color: var(--btn2-ink);
        font-size: 1.02rem;
        font-weight: 600;
        padding: 14px 10px;
        cursor: pointer;
        touch-action: manipulation;
      }

      footer {
        margin-top: auto;
        padding-top: 22px;
        text-align: center;
        color: var(--muted);
        font-size: 0.86rem;
        line-height: 1.5;
      }
    </style>
  </head>

    <main class="wrap">
      <p class="intro">A verse for this moment, drawn at random from across the whole Bible — like letting the pages fall open where they will.</p>

      <section class="card" id="card" aria-live="polite">
        <svg class="ornament" width="72" height="14" viewBox="0 0 72 14" aria-hidden="true">

          <rect x="31" y="2" width="10" height="10" transform="rotate(45 36 7)" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.8" />
          <line x1="46" y1="7" x2="72" y2="7" stroke="currentColor" stroke-width="1" opacity="0.45" />
        </svg>
        <p class="verse-text" id="verseText"></p>
        <p class="verse-ref" id="verseRef"></p>
      </section>

      <button class="primary" id="drawBtn" type="button">Give me a verse</button>

      <div class="row">
        <button id="anotherBtn" type="button">Another verse</button>
        <button id="copyBtn" type="button">Copy verse</button>
      </div>

      <footer>World English Bible (WEB) — public domain. Share freely.</footer>
    </main>

      var card = document.getElementById("card");
      var verseText = document.getElementById("verseText");
      var verseRef = document.getElementById("verseRef");
      var copyBtn = document.getElementById("copyBtn");
      var current = -1;
      var copyTimer = null;

      function draw() {
        var next = current;
        if (VERSES.length > 1) {
          while (next === current) {
            next = Math.floor(Math.random() * VERSES.length);
          }
        } else {
          next = 0;
        }
        current = next;
        verseText.textContent = VERSES[current].t;
        verseRef.textContent = VERSES[current].r;
        card.classList.remove("swap");
        void card.offsetWidth;
        card.classList.add("swap");
      }

      function copyVerse() {
        if (current < 0) return;
        var v = VERSES[current];
        var text = v.t + " \u2014 " + v.r + " (WEB)";
        function done() {
          copyBtn.textContent = "Copied \u2713";
          if (copyTimer) clearTimeout(copyTimer);
          copyTimer = setTimeout(function () { copyBtn.textContent = "Copy verse"; }, 1800);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, function () { fallback(); });
        } else {
          fallback();
        }
        function fallback() {
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand("copy"); done(); } catch (e) {}
          document.body.removeChild(ta);
        }
      }

      document.getElementById("drawBtn").addEventListener("click", draw);
      document.getElementById("anotherBtn").addEventListener("click", draw);
      copyBtn.addEventListener("click", copyVerse);

      draw();
    </script>
